name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools and dependencies
        run: pacman -Syu --noconfirm --needed base-devel git python pyside6 qt6-svg pacman-contrib polkit

      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          bash -n helpers/archupdater-root
          bash -n helpers/archupdater-sudo
          sh -n bin/archupdater

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder makepkg --noconfirm --force
          ls -l ./*.pkg.tar.zst

      - name: Install and start it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          archupdater --version
          test -x /usr/lib/archupdater/archupdater-root
          test -f /usr/share/polkit-1/actions/io.github.ppcharcoal.archupdater.policy

      - uses: actions/upload-artifact@v4
        with:
          name: archupdater-package
          path: ./*.pkg.tar.zst

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.pkg.tar.zst
          generate_release_notes: true
